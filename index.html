<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Under Scanner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
        h1 { text-align: center; color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 8px; }
        .teams { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }
        .pass { background-color: #059669; color: #ecfdf5; }
        .skip { background-color: #dc2626; color: #fef2f2; }
        .stats { font-size: 13px; color: #cbd5e1; margin-top: 8px; line-height: 1.4; }
        .error-box { background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

    <h1>⚽ Football Under Scanner</h1>
    <div id="matches-container">Loading matches...</div>

    <script>
        const SUPABASE_URL = "https://whtvjpowjzexmvcxnsmu.supabase.co";
        const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodHZqcG93anpleG12Y3huc211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDUyMTAsImV4cCI6MjEwMTIyMTIxMH0.C9SKEQIVwtR6Nv-2_7skWipW_-_FALgQ0nuTY4ONCiQ";

        async function fetchMatches() {
            const container = document.getElementById('matches-container');
            try {
                // Direct REST API Fetch without external CDN library dependency
                const response = await fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errData = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errData}`);
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>No matches found in database.</p>";
                    return;
                }

                container.innerHTML = "";
                data.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const isPass = match.status === 'PASS';
                    
                    let statsObj = match.stats;
                    if (typeof statsObj === 'string') {
                        try { statsObj = JSON.parse(statsObj); } catch(e) {}
                    }
                    statsObj = statsObj || {};

                    const decisionText = statsObj.decision || match.stats || match.status || 'UNKNOWN';
                    const cornerAvg = statsObj.corner_avg || '-';
                    const sotAvg = statsObj.sot_avg || '-';

                    card.innerHTML = `
                        <div class="header">
                            <span>${match.league || 'League'}</span>
                            <span>Phase ${match.phase || 1} (${match.confidence || 0}% Confidence)</span>
                        </div>
                        <div class="teams">${match.home_team || 'Home'} vs ${match.away_team || 'Away'}</div>
                        <div class="badge ${isPass ? 'pass' : 'skip'}">
                            ${decisionText}
                        </div>
                        <div class="stats">
                            Corner Avg: ${cornerAvg} | SoT Avg: ${sotAvg}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="error-box"><b>Error details:</b><br>${err.message}</div>`;
            }
        }

        fetchMatches();
    </script>
</body>
</html>
